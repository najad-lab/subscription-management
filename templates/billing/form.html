{% extends "billing/base.html" %}{% block content %}<div class="top"><div><h1>{{ title }}</h1><div class="sub">Enter details below</div></div></div><div class="panel" style="max-width:760px"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="form-row"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}<button class="btn" type="submit">Save</button> <a class="btn secondary" href="javascript:history.back()">Cancel</a></form></div>{% endblock %}
