<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightloop | Subscription Manager</title>
<style>
:root{--bg:#f4f7fb;--ink:#172033;--muted:#65738b;--blue:#3157d5;--line:#e3e9f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.layout{display:flex;min-height:100vh}.side{width:230px;background:#111b31;color:white;padding:26px 16px;flex-shrink:0}
.brand{font-size:21px;font-weight:800;margin:0 10px 28px}.brand span{color:#8ba5ff}
.side a{display:block;color:#cbd5e8;text-decoration:none;padding:12px 14px;border-radius:9px;margin:4px 0}.side a:hover,.side a.active{background:#263654;color:white}
main{flex:1;padding:30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}
h1{font-size:27px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--blue);color:white;text-decoration:none;border:0;border-radius:8px;padding:10px 15px;font-weight:600;cursor:pointer}.btn.secondary{background:#e8edff;color:#2748b5}.btn.small{padding:6px 9px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 3px 12px #182b4a08}
.metric{font-size:26px;font-weight:800;margin:10px 0 4px}.label{color:var(--muted);font-size:13px}.panel{margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.badge{padding:5px 8px;border-radius:20px;background:#eef2f8;font-size:12px;white-space:nowrap}.badge.Active,.badge.Paid{background:#e3f8ed;color:#16824e}.badge.Unpaid,.badge.Overdue{background:#fff0df;color:#a75a00}
.form-control{width:100%;padding:10px;border:1px solid #d7dfeb;border-radius:7px;background:white;font:inherit}.form-row{margin-bottom:16px}.form-row label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.helptext{font-size:12px;color:var(--muted)}.errorlist{color:#b42318}
.messages{list-style:none;padding:0}.messages li{background:#e8f5ed;padding:10px 14px;border-radius:8px;margin-bottom:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{color:var(--muted);padding:20px;text-align:center}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:190px}main{padding:20px}}
@media(max-width:650px){.layout{display:block}.side{width:100%;padding:12px}.brand{margin:8px}.side nav{display:flex;overflow:auto}.side a{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}main{padding:14px}.top{align-items:flex-start;flex-direction:column}.table-wrap{overflow:auto}}
</style></head><body><div class="layout">
<aside class="side"><div class="brand">bright<span>loop</span></div><nav>
<a href="/">Dashboard</a><a href="/products/">Products</a><a href="/plans/">Plans</a><a href="/subscriptions/">Subscriptions</a><a href="/invoices/">Invoices</a><a href="/payments/">Payments</a><a href="/admin/">Admin</a>
</nav></aside><main>
{% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main></div></body></html>
